<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Gestion des stocks ONSSA</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    /* GSRV System - Global Grey/White Theme */
    :root {
      /* Primary Colors */
      --primary-50: #f8fafc;
      --primary-100: #f1f5f9;
      --primary-200: #e2e8f0;
      --primary-300: #cbd5e1;
      --primary-400: #94a3b8;
      --primary-500: #64748b;
      --primary-600: #475569;
      --primary-700: #334155;
      --primary-800: #1e293b;
      --primary-900: #0f172a;

      /* Accent Colors */
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-yellow: #f59e0b;
      --accent-red: #ef4444;
      --accent-purple: #8b5cf6;

      /* Background Colors */
      --bg-primary: #ffffff;
      --bg-secondary: #f8fafc;
      --bg-tertiary: #f1f5f9;
      --bg-card: #ffffff;
      --bg-sidebar: #ffffff;
      --bg-header: #ffffff;

      /* Text Colors */
      --text-primary: #1e293b;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --text-light: #94a3b8;

      /* Border Colors */
      --border-light: #e2e8f0;
      --border-medium: #cbd5e1;
      --border-dark: #94a3b8;

      /* Shadow Colors */
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    }

    /* Global Theme Overrides */
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
      background: var(--bg-secondary) !important;
      color: var(--text-primary) !important;
      line-height: 1.6 !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    /* Override Bootstrap default colors */
    .text-muted {
      color: var(--text-muted) !important;
    }

    .text-secondary {
      color: var(--text-secondary) !important;
    }

    /* Ensure all cards use our theme */
    .card {
      background: var(--bg-card) !important;
      color: var(--text-primary) !important;
      border: 1px solid var(--border-light) !important;
      border-radius: 0.75rem !important;
      box-shadow: var(--shadow-md) !important;
    }

    /* Override Bootstrap table styles */
    .table {
      color: var(--text-primary) !important;
    }

    .table thead th {
      background: var(--bg-tertiary) !important;
      color: var(--text-primary) !important;
      border-color: var(--border-light) !important;
    }

    .table tbody tr {
      background: transparent !important;
      color: var(--text-primary) !important;
    }

    .table tbody tr:hover {
      background: var(--bg-secondary) !important;
    }

    /* Override Bootstrap button defaults */
    .btn {
      border-radius: 0.75rem !important;
      font-weight: 600 !important;
      transition: all 0.2s ease !important;
    }

    .btn-primary {
      background: var(--accent-blue) !important;
      border-color: var(--accent-blue) !important;
    }

    .btn-success {
      background: var(--accent-green) !important;
      border-color: var(--accent-green) !important;
    }

    .btn-warning {
      background: var(--accent-yellow) !important;
      border-color: var(--accent-yellow) !important;
    }

    .btn-danger {
      background: var(--accent-red) !important;
      border-color: var(--accent-red) !important;
    }

    /* Override Bootstrap alert styles */
    .alert {
      border-radius: 0.75rem !important;
      border: 1px solid var(--border-light) !important;
    }

    .alert-primary {
      background: rgb(59 130 246 / 0.1) !important;
      border-color: var(--accent-blue) !important;
      color: var(--accent-blue) !important;
    }

    .alert-success {
      background: rgb(16 185 129 / 0.1) !important;
      border-color: var(--accent-green) !important;
      color: var(--accent-green) !important;
    }

    .alert-warning {
      background: rgb(245 158 11 / 0.1) !important;
      border-color: var(--accent-yellow) !important;
      color: var(--accent-yellow) !important;
    }

    .alert-danger {
      background: rgb(239 68 68 / 0.1) !important;
      border-color: var(--accent-red) !important;
      color: var(--accent-red) !important;
    }

    /* Override Bootstrap form styles */
    .form-control {
      border-color: var(--border-light) !important;
      border-radius: 0.75rem !important;
      background: var(--bg-primary) !important;
      color: var(--text-primary) !important;
    }

    .form-control:focus {
      border-color: var(--accent-blue) !important;
      box-shadow: 0 0 0 3px rgb(59 130 246 / 0.1) !important;
    }

    /* Override Bootstrap badge styles */
    .badge {
      border-radius: 1rem !important;
      font-weight: 600 !important;
    }

    .badge.bg-primary {
      background: var(--accent-blue) !important;
    }

    .badge.bg-success {
      background: var(--accent-green) !important;
    }

    .badge.bg-warning {
      background: var(--accent-yellow) !important;
    }

    .badge.bg-danger {
      background: var(--accent-red) !important;
    }

    /* Smooth scrolling */
    html {
      scroll-behavior: smooth !important;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-secondary);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-medium);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--border-dark);
    }

    /* Focus styles for accessibility */
    *:focus {
      outline: 2px solid var(--accent-blue) !important;
      outline-offset: 2px !important;
    }

    /* Smooth transitions for all elements */
    * {
      transition: all 0.2s ease !important;
    }
  </style>
</head>

<body>
  <app-root></app-root>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
    crossorigin="anonymous"></script>
</body>

</html>
